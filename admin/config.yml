# ============================================================
#  Админ хэсгийн (Decap CMS) тохиргоо
#  Нэвтрэлт: Netlify Identity + Git Gateway
#  Нийтлэлүүд posts/ хавтсанд .mn.md, .en.md файлаар хадгалагдана.
# ============================================================

backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: "Шинэ нийтлэл: {{slug}}"
    update: "Нийтлэл засав: {{slug}}"
    delete: "Нийтлэл устгав: {{slug}}"
    uploadMedia: "Зураг нэмэв: {{path}}"
    deleteMedia: "Зураг устгав: {{path}}"

# Зураг, файлууд энд хадгалагдана
media_folder: "uploads"
public_folder: "/uploads"

site_url: "/"
display_url: "/"
logo_url: "/admin/logo.svg"

# Монгол, англи хоёр хэл
i18n:
  structure: multiple_files
  locales: [mn, en, hu]
  default_locale: mn

collections:
  - name: posts
    label: "Блогийн нийтлэлүүд"
    label_singular: "нийтлэл"
    description: "Сайтын блогт гарах нийтлэлүүд. Монгол хувилбарыг заавал бөглөнө; англи, магяр хувилбар сонголттой (бөглөөгүй бол англи, тэгээд монгол харагдана)."
    folder: "posts"
    extension: "md"
    format: "frontmatter"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    i18n: true
    summary: "{{title}} · {{date | date('YYYY.MM.DD')}}"
    sortable_fields: ["date", "title", "category"]
    view_filters:
      - { label: "Усны бодлого", field: category, pattern: policy }
      - { label: "Ундны ус", field: category, pattern: drinking }
      - { label: "Байгаль орчин", field: category, pattern: env }
      - { label: "Олон улсын хамтын ажиллагаа", field: category, pattern: intl }
      - { label: "Төрийн захиргаа", field: category, pattern: admin }
    fields:
      - { name: title, label: "Гарчиг", widget: string, i18n: true }
      - name: date
        label: "Нийтлэх огноо"
        widget: datetime
        i18n: duplicate
        format: "YYYY-MM-DD"
        date_format: "YYYY.MM.DD"
        time_format: false
      - name: category
        label: "Ангилал"
        widget: select
        i18n: duplicate
        options:
          - { label: "Усны бодлого", value: policy }
          - { label: "Ундны ус", value: drinking }
          - { label: "Байгаль орчин", value: env }
          - { label: "Олон улсын хамтын ажиллагаа", value: intl }
          - { label: "Төрийн захиргаа", value: admin }
      - { name: cover, label: "Нүүр зураг", widget: image, i18n: duplicate, required: false }
      - { name: summary, label: "Товч агуулга", widget: text, i18n: true, hint: "Блогийн жагсаалтад харагдах 1–2 өгүүлбэр." }
      - { name: featured, label: "Онцлох нийтлэл (блогийн хамгийн дээр том харагдана)", widget: boolean, i18n: duplicate, default: false, required: false }
      - { name: body, label: "Нийтлэлийн эх", widget: markdown, i18n: true }

  # ---------------- Хэвлэлд гарсан мэдээ ----------------
  - name: press
    label: "Хэвлэлд гарсан мэдээ"
    label_singular: "мэдээ"
    description: "Бусад сайт, хэвлэлд гарсан мэдээний холбоосууд. Нүүр хуудсанд сүүлийн 6 нь, бүгд нь «Бүх мэдээ» хуудсанд харагдана."
    folder: "press"
    editor: { preview: false }
    extension: "md"
    format: "frontmatter"
    create: true
    i18n: false
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    summary: "{{date | date('YYYY.MM.DD')}} · {{source}} · {{title}}"
    sortable_fields: ["date", "source", "title"]
    fields:
      - { name: url, label: "Мэдээний холбоос (линк)", widget: string, pattern: ["^https?://", "https:// эсвэл http://-ээр эхэлсэн линк оруулна уу"] }
      - { name: title, label: "Гарчиг (монгол)", widget: string }
      - { name: title_en, label: "Гарчиг (англи)", widget: string, required: false, hint: "Хоосон орхивол англи хэл дээр монгол гарчиг харагдана." }
      - { name: title_hu, label: "Гарчиг (магяр)", widget: string, required: false, hint: "Хоосон орхивол англи, тэгээд монгол гарчиг харагдана." }
      - { name: source, label: "Хэвлэлийн нэр", widget: string, required: false, hint: "Жишээ: ikon.mn, gogo.mn, Монцамэ. Хоосон орхивол линкээс автоматаар авна." }
      - name: date
        label: "Огноо"
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY.MM.DD"
        time_format: false

  # ---------------- 333 нуур: нуур бүр ----------------
  - name: lakes
    label: "333 нуур: нуурууд"
    label_singular: "нуур"
    description: "«Нэг сум — Нэг нуур — 333 нуур» хөтөлбөрийн нуур, цөөрөм бүр. Төлөв нь «Ашиглалтад орсон» болоход сайтын тоолуур автоматаар шинэчлэгдэнэ."
    folder: "lakes"
    editor: { preview: false }
    extension: "md"
    format: "frontmatter"
    create: true
    i18n: false
    slug: "{{slug}}"
    identifier_field: name
    summary: "{{name}} · {{soum}} сум · {{status}}"
    sortable_fields: ["name", "aimag", "status", "year"]
    view_filters:
      - { label: "Ашиглалтад орсон", field: status, pattern: done }
      - { label: "Байгуулж буй", field: status, pattern: building }
      - { label: "Төлөвлөсөн", field: status, pattern: planned }
    fields:
      - { name: name, label: "Нуурын нэр (монгол)", widget: string }
      - { name: name_en, label: "Нуурын нэр (англи)", widget: string, required: false }
      - { name: name_hu, label: "Нуурын нэр (магяр)", widget: string, required: false }
      - name: aimag
        label: "Аймаг"
        widget: select
        options:
          - { label: "Архангай", value: arkhangai }
          - { label: "Баян-Өлгий", value: bayan_ulgii }
          - { label: "Баянхонгор", value: bayankhongor }
          - { label: "Булган", value: bulgan }
          - { label: "Говь-Алтай", value: govi_altai }
          - { label: "Говьсүмбэр", value: govisumber }
          - { label: "Дархан-Уул", value: darkhan_uul }
          - { label: "Дорноговь", value: dornogovi }
          - { label: "Дорнод", value: dornod }
          - { label: "Дундговь", value: dundgovi }
          - { label: "Завхан", value: zavkhan }
          - { label: "Орхон", value: orkhon }
          - { label: "Өвөрхангай", value: uvurkhangai }
          - { label: "Өмнөговь", value: umnugovi }
          - { label: "Сүхбаатар", value: sukhbaatar }
          - { label: "Сэлэнгэ", value: selenge }
          - { label: "Төв", value: tuv }
          - { label: "Увс", value: uvs }
          - { label: "Ховд", value: khovd }
          - { label: "Хөвсгөл", value: khuvsgul }
          - { label: "Хэнтий", value: khentii }
          - { label: "Улаанбаатар", value: ulaanbaatar }
      - { name: soum, label: "Сум / дүүрэг", widget: string }
      - { name: soum_en, label: "Сум (англи)", widget: string, required: false }
      - { name: soum_hu, label: "Сум (магяр)", widget: string, required: false }
      - name: status
        label: "Төлөв"
        widget: select
        default: planned
        options:
          - { label: "Ашиглалтад орсон", value: done }
          - { label: "Байгуулж буй", value: building }
          - { label: "Төлөвлөсөн", value: planned }
      - name: kind
        label: "Төрөл"
        widget: select
        required: false
        options:
          - { label: "Шинэ нуур", value: new }
          - { label: "Хөв, цөөрөм", value: reservoir }
          - { label: "Сэргээсэн нуур", value: restored }
      - { name: year, label: "Он (ашиглалтад орсон / орох)", widget: number, value_type: int, required: false }
      - { name: volume_m3, label: "Усны багтаамж (м³)", widget: number, value_type: float, required: false }
      - { name: area_ha, label: "Талбай (га)", widget: number, value_type: float, required: false }
      - name: purposes
        label: "Зорилго"
        widget: select
        multiple: true
        required: false
        options:
          - { label: "Хүн амын ундны ус", value: drinking }
          - { label: "Мал аж ахуйн ус", value: livestock }
          - { label: "Тариалангийн ус", value: farming }
          - { label: "Үерээс хамгаалах", value: flood }
          - { label: "Экологийн тэнцвэр", value: ecology }
      - { name: partners, label: "Хамтрагч байгууллагууд", widget: string, required: false }
      - { name: partners_en, label: "Хамтрагч байгууллагууд (англи)", widget: string, required: false }
      - { name: partners_hu, label: "Хамтрагч байгууллагууд (магяр)", widget: string, required: false }
      - { name: lat, label: "Өргөрөг (latitude)", widget: number, value_type: float, required: false, hint: "Google Maps дээр нуурын байрлал дээр баруун товч дарахад гарах эхний тоо. Жишээ: 47.19" }
      - { name: lng, label: "Уртраг (longitude)", widget: number, value_type: float, required: false, hint: "Хоёр дахь тоо. Жишээ: 102.82" }
      - { name: approx, label: "Байршил ойролцоо (жишээ нь сумын төвийн координат)", widget: boolean, default: false, required: false, hint: "Нарийн координат мэдэхгүй бол асаана. Зураг дээр хөндий цэгээр харагдана. Координат огт оруулаагүй бол нуур аймгийн төв дээр ойролцоогоор харагдана." }
      - { name: photo, label: "Зураг", widget: image, required: false }
      - { name: source_url, label: "Эх сурвалж (мэдээний линк)", widget: string, required: false }
      - { name: description_en, label: "Тайлбар (англи)", widget: markdown, required: false, buttons: [bold, italic, link, bulleted-list] }
      - { name: description_hu, label: "Тайлбар (магяр)", widget: markdown, required: false, buttons: [bold, italic, link, bulleted-list] }
      - { name: body, label: "Тайлбар (монгол)", widget: markdown, required: false }

  # ---------------- Би хэн бэ ----------------
  - name: about
    label: "Би хэн бэ"
    description: "Нүүр хуудасны «Би хэн бэ» хэсгийн бичвэр, дараалан солигдох 4–5 зураг."
    editor: { preview: false }
    files:
      - name: about
        label: "Би хэн бэ: бичвэр ба зургууд"
        file: "data/about.json"
        format: json
        media_folder: "/uploads/about"
        public_folder: "/uploads/about"
        fields:
          - { name: intro_mn, label: "Танилцуулга (монгол)", widget: markdown, required: false, buttons: [bold, italic, link], hint: "Хоосон орхивол сайтад байгаа анхны бичвэр харагдана. Догол мөр бүрийг хоосон мөрөөр тусгаарлана." }
          - { name: intro_en, label: "Танилцуулга (англи)", widget: markdown, required: false, buttons: [bold, italic, link] }
          - { name: intro_hu, label: "Танилцуулга (магяр)", widget: markdown, required: false, buttons: [bold, italic, link] }
          - name: photos
            label: "Зургууд (дарааллаар нь)"
            label_singular: "зураг"
            widget: list
            required: false
            hint: "4–5 зураг. Дээрээс доош дарааллаараа 5 секунд тутам солигдоно. Босоо (4:5) зураг хамгийн тохиромжтой."
            summary: "{{fields.caption}}"
            fields:
              - { name: image, label: "Зураг", widget: image }
              - { name: caption, label: "Тайлбар (монгол)", widget: string, required: false }
              - { name: caption_en, label: "Тайлбар (англи)", widget: string, required: false }
              - { name: caption_hu, label: "Тайлбар (магяр)", widget: string, required: false }

  # ---------------- 333 нуур: хөтөлбөрийн тоон үзүүлэлт ----------------
  - name: settings
    label: "333 нуур: тоон үзүүлэлт"
    description: "Сайтын «333 нуур» хэсгийн дээд талын тоонууд. Ашиглалтад орсон / байгуулж буй тоог оруулбал явцын шугам харагдана; хоосон орхивол харагдахгүй."
    editor: { preview: false }
    files:
      - name: lakes_program
        label: "Хөтөлбөрийн тоонууд"
        file: "data/lakes-program.json"
        format: json
        fields:
          - { name: target, label: "Зорилтот нуурын тоо", widget: number, value_type: int, default: 333 }
          - { name: sites_identified, label: "Тохиромжтой байршил тогтоосон", widget: number, value_type: int, required: false }
          - { name: completed, label: "Ашиглалтад орсон (албан ёсны тоо)", widget: number, value_type: int, required: false, hint: "Албан ёсны тоо. Хоосон орхивол сайтад харагдахгүй." }
          - { name: in_progress, label: "Байгуулж буй (албан ёсны тоо)", widget: number, value_type: int, required: false, hint: "Албан ёсны тоо. Хоосон орхивол сайтад харагдахгүй." }
          - { name: as_of, label: "Тоон мэдээллийн огноо", widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY.MM.DD", time_format: false, required: false }
          - { name: note, label: "Тайлбар (монгол)", widget: string, required: false }
          - { name: note_en, label: "Тайлбар (англи)", widget: string, required: false }
          - { name: note_hu, label: "Тайлбар (магяр)", widget: string, required: false }
          - { name: source_url, label: "Эх сурвалж (линк)", widget: string, required: false }

  # ---------------- Зургийн цомог ----------------
  - name: gallery
    label: "Зургийн цомог"
    label_singular: "цомог"
    description: "Арга хэмжээ, ажлын талбайн зургууд. Цомог бүрт олон зураг. Зургийг 2–3 MB-аас ихгүй, урт тал нь 2000 px орчим байхаар багасгаж оруулахыг зөвлөж байна."
    folder: "gallery"
    editor: { preview: false }
    media_folder: "/uploads/gallery"
    public_folder: "/uploads/gallery"
    extension: "md"
    format: "frontmatter"
    create: true
    i18n: false
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    summary: "{{date | date('YYYY.MM.DD')}} · {{title}}"
    sortable_fields: ["date", "title"]
    fields:
      - { name: title, label: "Цомгийн нэр (монгол)", widget: string, hint: "Жишээ: Хэлтгийн цагаан нуурын нээлт" }
      - { name: title_en, label: "Цомгийн нэр (англи)", widget: string, required: false }
      - { name: title_hu, label: "Цомгийн нэр (магяр)", widget: string, required: false }
      - name: date
        label: "Огноо"
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY.MM.DD"
        time_format: false
      - { name: location, label: "Газар", widget: string, required: false, hint: "Жишээ: Өвөрхангай, Хархорин" }
      - { name: cover, label: "Нүүр зураг", widget: image, required: false, hint: "Хоосон орхивол эхний зураг нүүр болно." }
      - name: photos
        label: "Зургууд"
        label_singular: "зураг"
        widget: list
        summary: "{{fields.caption}}"
        min: 1
        fields:
          - { name: image, label: "Зураг", widget: image }
          - { name: caption, label: "Тайлбар", widget: string, required: false }
      - { name: description_en, label: "Тайлбар (англи)", widget: text, required: false }
      - { name: description_hu, label: "Тайлбар (магяр)", widget: text, required: false }
      - { name: body, label: "Тайлбар (монгол)", widget: markdown, required: false, buttons: [bold, italic, link] }

  # ---------------- Ном ----------------
  - name: books
    label: "Ном"
    label_singular: "ном"
    description: "Батбаярын бичсэн номууд. PDF хавсаргавал сайт дээр уншиж, татаж авах боломжтой. PDF файл 20 MB-аас бага байхыг зөвлөж байна."
    folder: "books"
    editor: { preview: false }
    media_folder: "/uploads/books"
    public_folder: "/uploads/books"
    extension: "md"
    format: "frontmatter"
    create: true
    i18n: false
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{year}} · {{title}}"
    sortable_fields: ["year", "title"]
    fields:
      - { name: title, label: "Номын нэр (монгол)", widget: string }
      - { name: title_en, label: "Номын нэр (англи)", widget: string, required: false }
      - { name: title_hu, label: "Номын нэр (магяр)", widget: string, required: false }
      - { name: year, label: "Хэвлэгдсэн он", widget: number, value_type: int, required: false }
      - { name: publisher, label: "Хэвлэлийн газар", widget: string, required: false }
      - name: languages
        label: "Номын хэл"
        widget: select
        multiple: true
        required: false
        options:
          - { label: "Монгол", value: mn }
          - { label: "Англи", value: en }
          - { label: "Магяр", value: hu }
          - { label: "Орос", value: ru }
          - { label: "Бусад", value: other }
      - { name: pages, label: "Хуудасны тоо", widget: number, value_type: int, required: false }
      - { name: isbn, label: "ISBN", widget: string, required: false }
      - { name: cover, label: "Хавтасны зураг", widget: image, required: false, hint: "Босоо (2:3) зураг. Хоосон орхивол номын нэртэй өнгөт хавтас автоматаар гарна." }
      - { name: pdf, label: "PDF файл", widget: file, required: false, hint: "Хавсаргавал сайт дээр «Унших», «PDF татах» товч гарна. 20 MB-аас бага байхыг зөвлөж байна." }
      - { name: buy_url, label: "Худалдаж авах холбоос", widget: string, required: false }
      - { name: order, label: "Эрэмбэ (жижиг тоо эхэнд)", widget: number, value_type: int, required: false, hint: "Хоосон орхивол шинэ номоос нь эхэлж харагдана." }
      - { name: description_en, label: "Тайлбар (англи)", widget: markdown, required: false, buttons: [bold, italic, link, bulleted-list] }
      - { name: description_hu, label: "Тайлбар (магяр)", widget: markdown, required: false, buttons: [bold, italic, link, bulleted-list] }
      - { name: body, label: "Тайлбар (монгол)", widget: markdown, required: false }
